<app-page-header
  [title]="isEditMode ? 'Modifier le contrat' : 'Personnaliser le contrat'"
  [subtitle]="(rentalPropertyName && tenantFullName) ? (rentalPropertyName + ' · ' + tenantFullName) : ''"
  [breadcrumbs]="[{label: 'Contrats', route: '/contracts'}, {label: isEditMode ? 'Modifier' : 'Personnaliser'}]">
</app-page-header>

<app-loading-skeleton *ngIf="loading" type="card" [count]="1"></app-loading-skeleton>

<div *ngIf="error" class="hw-alert hw-alert--danger">
  <i class="bi bi-exclamation-triangle-fill"></i>
  <span>{{ error }}</span>
  <button class="hw-btn hw-btn--sm hw-btn--ghost ms-2" (click)="cancel()">Retour</button>
</div>

<div *ngIf="!loading && !error" class="row">
  <div class="col-lg-8">
    <div class="hw-card mb-3">
      <label class="form-label">Contenu du contrat <span class="text-danger">*</span></label>
      <p class="hw-text-muted hw-text-sm">
        Modifiez le contenu ci-dessous. Utilisez le panneau de droite pour insérer des variables.
        Les variables déjà présentes ont été remplacées par les valeurs réelles.
      </p>
      <quill-editor
        #editor
        [modules]="quillModules"
        [styles]="{'min-height': '500px'}"
        (onEditorCreated)="onEditorCreated($event)"
        (onSelectionChanged)="onEditorSelectionChanged($event)">
      </quill-editor>
    </div>

    <div class="d-flex gap-2">
      <button type="button" class="hw-btn hw-btn--ghost" (click)="cancel()" [disabled]="submitting">Annuler</button>
      <button type="button" class="hw-btn hw-btn--primary" (click)="generateContract()" [disabled]="submitting">
        <span *ngIf="submitting" class="spinner-border spinner-border-sm me-2"></span>
        <i *ngIf="!submitting" class="bi bi-file-earmark-check me-1"></i>
        {{ isEditMode ? 'Enregistrer les modifications' : 'Générer le contrat' }}
      </button>
    </div>
  </div>

  <div class="col-lg-4">
    <div class="sticky-top" style="top: 20px;">
      <app-variable-helper (variableSelected)="onVariableSelected($event)"></app-variable-helper>
    </div>
  </div>
</div>
