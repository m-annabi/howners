<app-page-header
  title="Avenants"
  [breadcrumbs]="[{label: 'Contrats', route: '/contracts'}, {label: 'Avenants'}]"
  [actions]="headerActions">
</app-page-header>

<ng-template #headerActions>
  <button class="hw-btn hw-btn--sm hw-btn--ghost me-2" (click)="goBack()">
    <i class="bi bi-arrow-left"></i> Retour au contrat
  </button>
  <button class="hw-btn hw-btn--primary" (click)="createAmendment()">
    <i class="bi bi-plus-lg"></i> Nouvel avenant
  </button>
</ng-template>

<app-loading-skeleton *ngIf="loading" type="card" [count]="3"></app-loading-skeleton>

<app-empty-state
  *ngIf="!loading && amendments.length === 0"
  icon="bi-file-earmark-plus"
  title="Aucun avenant pour ce contrat">
</app-empty-state>

<div *ngIf="!loading && amendments.length > 0" class="hw-card" style="padding: 0; overflow-x: auto;">
  <table class="hw-table">
    <thead>
      <tr><th>N°</th><th>Motif</th><th>Ancien loyer</th><th>Nouveau loyer</th><th>Date d'effet</th><th>Statut</th><th></th></tr>
    </thead>
    <tbody>
      <tr *ngFor="let a of amendments">
        <td><strong>Avenant n°{{ a.amendmentNumber }}</strong></td>
        <td>{{ a.reason }}</td>
        <td>{{ a.previousRent ? (a.previousRent | number:'1.2-2') + ' €' : '—' }}</td>
        <td>{{ a.newRent ? (a.newRent | number:'1.2-2') + ' €' : '—' }}</td>
        <td>{{ a.effectiveDate | date:'dd/MM/yyyy' }}</td>
        <td><app-status-badge [status]="a.status" type="contract"></app-status-badge></td>
        <td>
          <div class="d-flex gap-1">
            <button class="hw-btn hw-btn--sm hw-btn--ghost" (click)="downloadPdf(a)" title="Télécharger PDF">
              <i class="bi bi-file-pdf"></i>
            </button>
            <button *ngIf="a.status === 'DRAFT' || a.status === 'SENT'" class="hw-btn hw-btn--sm hw-btn--primary"
                    (click)="signAmendment(a)" title="Signer">
              <i class="bi bi-pen"></i> Signer
            </button>
          </div>
        </td>
      </tr>
    </tbody>
  </table>
</div>
