<app-page-header
  title="Nouvel avenant"
  [subtitle]="contract ? 'Contrat ' + contract.contractNumber : ''"
  [breadcrumbs]="[{label: 'Contrats', route: '/contracts'}, {label: 'Nouvel avenant'}]">
</app-page-header>

<app-loading-skeleton *ngIf="loading" type="card" [count]="1"></app-loading-skeleton>

<form *ngIf="!loading" (ngSubmit)="submit()">
  <div class="hw-card">
    <div class="mb-3">
      <label class="form-label">Motif de l'avenant <span class="text-danger">*</span></label>
      <textarea class="form-control" [(ngModel)]="reason" name="reason" rows="3"
                placeholder="Décrivez le motif de l'avenant…" required></textarea>
    </div>

    <div class="mb-3">
      <label class="form-label">Détails des modifications</label>
      <textarea class="form-control" [(ngModel)]="changes" name="changes" rows="4"
                placeholder="Détaillez les modifications apportées au contrat…"></textarea>
    </div>

    <div class="row">
      <div class="col-md-4 mb-3">
        <label class="form-label">Ancien loyer (€)</label>
        <input type="number" class="form-control" [(ngModel)]="previousRent" name="previousRent" step="0.01" min="0" placeholder="0.00">
      </div>
      <div class="col-md-4 mb-3">
        <label class="form-label">Nouveau loyer (€)</label>
        <input type="number" class="form-control" [(ngModel)]="newRent" name="newRent" step="0.01" min="0" placeholder="0.00">
      </div>
      <div class="col-md-4 mb-3">
        <label class="form-label">Date d'effet <span class="text-danger">*</span></label>
        <input type="date" class="form-control" [(ngModel)]="effectiveDate" name="effectiveDate" required>
      </div>
    </div>
  </div>

  <div class="mt-3 d-flex gap-2">
    <button type="submit" class="hw-btn hw-btn--primary" [disabled]="submitting || !reason || !effectiveDate">
      <span *ngIf="submitting" class="spinner-border spinner-border-sm me-1"></span>
      Créer l'avenant
    </button>
    <button type="button" class="hw-btn hw-btn--ghost" (click)="cancel()">Annuler</button>
  </div>
</form>
