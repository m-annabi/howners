<div class="msg-thread">

  <!-- En-tête du fil -->
  <div class="msg-thread__header">
    <a routerLink="/messages" class="msg-thread__back" title="Retour aux conversations">
      <i class="bi bi-arrow-left"></i>
    </a>
    <span class="msg-avatar" [style.background]="avatarColor(displayName)">
      {{ displayName.charAt(0).toUpperCase() }}
    </span>
    <span class="msg-thread__name">{{ displayName }}</span>
  </div>

  <!-- Messages -->
  <div #messagesContainer class="msg-thread__body">
    <app-loading-skeleton *ngIf="loading" type="card" [count]="3"></app-loading-skeleton>

    <div *ngIf="!loading && messages.length === 0" class="msg-thread__empty">
      <i class="bi bi-chat-square-text"></i>
      <p>Commencez la conversation</p>
    </div>

    <ng-container *ngFor="let msg of messages; let i = index">
      <div *ngIf="isNewDay(i)" class="msg-day">
        <span>{{ dayLabel(msg) }}</span>
      </div>

      <div class="msg-row" [class.msg-row--mine]="isMyMessage(msg)">
        <div class="msg-bubble" [class.msg-bubble--mine]="isMyMessage(msg)">
          <div class="msg-bubble__text">{{ msg.body }}</div>
          <div class="msg-bubble__footer">
            <span>{{ msg.createdAt | date:'HH:mm' }}</span>
            <i *ngIf="isMyMessage(msg)"
               class="bi msg-bubble__receipt"
               [class.bi-check2-all]="msg.isRead"
               [class.bi-check2]="!msg.isRead"
               [class.msg-bubble__receipt--read]="msg.isRead"></i>
          </div>
        </div>
      </div>
    </ng-container>
  </div>

  <!-- Saisie -->
  <div class="msg-thread__footer">
    <input type="text" class="msg-input" [(ngModel)]="newMessage"
           placeholder="Votre message…" (keyup.enter)="send()" [disabled]="sending">
    <button class="msg-send" (click)="send()" [disabled]="!newMessage.trim() || sending" title="Envoyer">
      <span *ngIf="sending" class="spinner-border spinner-border-sm"></span>
      <i *ngIf="!sending" class="bi bi-send-fill"></i>
    </button>
  </div>

</div>
