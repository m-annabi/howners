<app-page-header title="Messages"></app-page-header>

<app-loading-skeleton *ngIf="loading" type="card" [count]="4"></app-loading-skeleton>

<app-empty-state
  *ngIf="!loading && conversations.length === 0"
  icon="bi-chat-square"
  title="Aucune conversation">
</app-empty-state>

<div class="conv-list" *ngIf="!loading && conversations.length > 0">
  <a *ngFor="let conv of conversations"
     [routerLink]="['/messages', conv.partnerId]"
     class="hw-card conv-item"
     [class.conv-item--unread]="!conv.lastMessageRead && conv.unreadCount > 0">
    <div class="conv-item__avatar">{{ conv.partnerName.charAt(0).toUpperCase() }}</div>
    <div class="conv-item__body">
      <div class="conv-item__name" [class.fw-bold]="conv.unreadCount > 0">{{ conv.partnerName }}</div>
      <div class="conv-item__preview">{{ conv.lastMessageBody }}</div>
    </div>
    <div class="conv-item__meta">
      <span class="hw-text-xs hw-text-muted">{{ conv.lastMessageAt | date:'dd/MM HH:mm' }}</span>
      <span *ngIf="conv.unreadCount > 0" class="hw-badge hw-badge--danger">{{ conv.unreadCount }}</span>
    </div>
  </a>
</div>
