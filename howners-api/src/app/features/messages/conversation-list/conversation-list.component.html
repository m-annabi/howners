<div class="msg-page" [class.msg-page--active]="activePartnerId">

  <!-- ══ Volet gauche : conversations ══ -->
  <aside class="msg-side">
    <div class="msg-side__header">
      <h2>Messages</h2>
    </div>

    <div class="msg-side__search">
      <i class="bi bi-search"></i>
      <input type="text" placeholder="Rechercher…" [(ngModel)]="searchTerm">
    </div>

    <div class="msg-side__list">
      <app-loading-skeleton *ngIf="loading" type="card" [count]="4"></app-loading-skeleton>

      <div *ngIf="!loading && conversations.length === 0" class="msg-side__empty">
        <i class="bi bi-chat-square"></i>
        <p>Aucune conversation</p>
      </div>

      <div *ngIf="!loading && conversations.length > 0 && filteredConversations.length === 0" class="msg-side__empty">
        <p>Aucun résultat pour « {{ searchTerm }} »</p>
      </div>

      <a *ngFor="let conv of filteredConversations; trackBy: trackByPartner"
         [routerLink]="['/messages', conv.partnerId]"
         class="msg-conv"
         [class.msg-conv--active]="conv.partnerId === activePartnerId"
         [class.msg-conv--unread]="conv.unreadCount > 0">
        <span class="msg-avatar" [style.background]="avatarColor(conv.partnerName)">
          {{ conv.partnerName.charAt(0).toUpperCase() }}
        </span>
        <span class="msg-conv__body">
          <span class="msg-conv__name">{{ conv.partnerName }}</span>
          <span class="msg-conv__preview">{{ conv.lastMessageBody }}</span>
        </span>
        <span class="msg-conv__meta">
          <span class="msg-conv__time">{{ conv.lastMessageAt | date:'dd/MM' }}</span>
          <span *ngIf="conv.unreadCount > 0" class="msg-conv__badge">{{ conv.unreadCount }}</span>
        </span>
      </a>
    </div>
  </aside>

  <!-- ══ Volet droit : fil actif ══ -->
  <section class="msg-thread-pane">
    <app-conversation-detail
      *ngIf="activePartnerId; else pickOne"
      [partnerId]="activePartnerId"
      [partnerName]="activePartnerName">
    </app-conversation-detail>

    <ng-template #pickOne>
      <div class="msg-thread-pane__placeholder">
        <i class="bi bi-chat-dots"></i>
        <p>Sélectionnez une conversation</p>
      </div>
    </ng-template>
  </section>

</div>
