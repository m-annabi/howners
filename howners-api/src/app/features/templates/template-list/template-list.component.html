<app-page-header
  title="Mes templates de contrat"
  [breadcrumbs]="[{label: 'Templates'}]"
  [actions]="headerActions">
</app-page-header>

<ng-template #headerActions>
  <button class="hw-btn hw-btn--primary" (click)="createTemplate()">
    <i class="bi bi-plus-lg"></i> Nouveau template
  </button>
</ng-template>

<div class="hw-list-toolbar">
  <select class="form-select form-select-sm hw-list-toolbar__select" [(ngModel)]="selectedType" (ngModelChange)="onTypeChange()" aria-label="Type de template">
    <option *ngFor="let type of types" [value]="type.value">{{ type.label }}</option>
  </select>
  <div class="hw-list-toolbar__search">
    <i class="bi bi-search"></i>
    <input type="text" placeholder="Rechercher par nom ou description…" [(ngModel)]="searchTerm" (ngModelChange)="onSearchChange()" aria-label="Rechercher un template">
  </div>
</div>

<app-loading-skeleton *ngIf="loading" type="card" [count]="3"></app-loading-skeleton>

<div *ngIf="error" class="hw-alert hw-alert--danger">
  <i class="bi bi-exclamation-triangle-fill"></i>
  <span>{{ error }}</span>
</div>

<div *ngIf="!loading && !error">
  <app-empty-state
    *ngIf="filteredTemplates.length === 0"
    icon="bi-file-earmark-text"
    title="Aucun template trouvé">
  </app-empty-state>

  <div *ngIf="filteredTemplates.length > 0" class="hw-card" style="padding: 0; overflow-x: auto;">
    <table class="hw-table">
      <thead><tr><th>Nom</th><th>Type</th><th>Description</th><th>Créé le</th><th></th></tr></thead>
      <tbody>
        <tr *ngFor="let template of filteredTemplates">
          <td>
            <strong>{{ template.name }}</strong>
            <span *ngIf="template.isDefault" class="hw-badge hw-badge--info ms-2">Par défaut</span><span *ngIf="!template.isDefault && !template.createdById" class="hw-badge hw-badge--neutral ms-2" title="Modèle fourni par Howners : dupliquez-le pour l'adapter">Modèle Howners</span>
          </td>
          <td><span class="hw-badge hw-badge--neutral">{{ getRentalTypeLabel(template.rentalType) }}</span></td>
          <td class="hw-text-sm hw-text-muted">{{ template.description || '—' }}</td>
          <td>{{ template.createdAt | date: 'dd/MM/yyyy' }}</td>
          <td>
            <div class="d-flex gap-1">
              <button *ngIf="!template.isDefault && template.createdById" class="hw-btn hw-btn--sm hw-btn--ghost" (click)="editTemplate(template, $event)" title="Modifier">
                <i class="bi bi-pencil"></i>
              </button>
              <button class="hw-btn hw-btn--sm hw-btn--ghost" (click)="duplicateTemplate(template, $event)" title="Dupliquer">
                <i class="bi bi-files"></i>
              </button>
              <button *ngIf="!template.isDefault && template.createdById" class="hw-btn hw-btn--sm hw-btn--ghost" (click)="deleteTemplate(template, $event)" title="Supprimer">
                <i class="bi bi-trash"></i>
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
