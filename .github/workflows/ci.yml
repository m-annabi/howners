name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: howners-back
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: howners-back/pom.xml

      - name: Compile
        run: ./mvnw compile -q

      - name: Test
        run: ./mvnw test

  frontend:
    name: Frontend — Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: howners-api
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: howners-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx ng build

  docker:
    name: Docker — Build & Push
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write   # nécessaire pour pousser sur GHCR via GITHUB_TOKEN
    strategy:
      matrix:
        include:
          - image: howners-backend
            context: ./howners-back
          - image: howners-frontend
            context: ./howners-api
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Connexion à GHCR uniquement lors d'un push (les PR ne poussent pas → pas de secret requis).
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          # Push seulement sur push to main ; sur PR on build pour valider le Dockerfile.
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy-staging:
    name: Deploy — Staging (Lightsail)
    runs-on: ubuntu-latest
    # Déploie seulement un push sur main dont les tests sont verts.
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Un seul déploiement à la fois ; les pushes rapprochés s'enchaînent.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Configurer la clé SSH
        # STAGING_SSH_KEY : clé privée ed25519 dédiée au déploiement (secret repo),
        # dont la clé publique est dans ~/.ssh/authorized_keys du serveur.
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 51.44.0.177 >> ~/.ssh/known_hosts

      - name: Synchroniser les sources
        # rsync plutôt que git pull : le serveur n'a besoin d'aucun credential GitHub.
        # .env.prod (secrets du serveur) et .git sont préservés.
        run: |
          rsync -az --delete --exclude '.git' --exclude '.env.prod' ./ ubuntu@51.44.0.177:~/howners/

      - name: Rebuild & redémarrer la stack
        run: |
          ssh ubuntu@51.44.0.177 'cd ~/howners && sudo docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build --remove-orphans'

      - name: Vérifier la santé
        run: |
          sleep 20
          curl -sf --max-time 20 https://api.staging.howners-app.com/actuator/health | grep -q '"status":"UP"'
          curl -sf -o /dev/null --max-time 15 https://staging.howners-app.com
