name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: howners-back
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: howners-back/pom.xml

      - name: Compile
        run: ./mvnw compile -q

      - name: Test
        run: ./mvnw test

  frontend:
    name: Frontend — Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: howners-api
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: howners-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx ng build

  docker:
    name: Docker — Build & Push
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write   # nécessaire pour pousser sur GHCR via GITHUB_TOKEN
    strategy:
      matrix:
        include:
          - image: howners-backend
            context: ./howners-back
            scope: howners-backend
            tags: |
              type=sha,format=short
              type=raw,value=latest,enable={{is_default_branch}}
          - image: howners-frontend
            context: ./howners-api
            scope: howners-frontend
            tags: |
              type=sha,format=short
              type=raw,value=latest,enable={{is_default_branch}}
          # Variante staging : l'URL de l'API est figée dans le bundle Angular au
          # build → une image par environnement (build-arg APP_DOMAIN).
          - image: howners-frontend
            context: ./howners-api
            scope: howners-frontend-staging
            build_args: |
              APP_DOMAIN=staging.howners-app.com
            tags: |
              type=raw,value=staging,enable={{is_default_branch}}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Connexion à GHCR uniquement lors d'un push (les PR ne poussent pas → pas de secret requis).
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: ${{ matrix.tags }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          # Push seulement sur push to main ; sur PR on build pour valider le Dockerfile.
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.scope }}

  deploy-staging:
    name: Deploy — Staging (Lightsail)
    runs-on: ubuntu-latest
    # Déploie seulement un push sur main dont les tests sont verts, à partir
    # des images construites par la CI (le serveur ne build plus rien).
    needs: [backend, frontend, docker]
    permissions:
      contents: read
      packages: read
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Un seul déploiement à la fois ; les pushes rapprochés s'enchaînent.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Configurer la clé SSH
        # STAGING_SSH_KEY : clé privée ed25519 dédiée au déploiement, encodée en
        # base64 sur UNE ligne (base64 -w0 deploy_key) — le collage multi-lignes
        # d'une clé PEM dans un secret est trop fragile (cf. "error in libcrypto").
        # La clé publique correspondante est dans ~/.ssh/authorized_keys du serveur.
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.STAGING_SSH_KEY }}" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 51.44.0.177 >> ~/.ssh/known_hosts

      - name: Synchroniser les sources
        # rsync plutôt que git pull : le serveur n'a besoin d'aucun credential GitHub.
        # .env.prod (secrets du serveur) et .git sont préservés.
        run: |
          rsync -az --delete --exclude '.git' --exclude '.env.prod' ./ ubuntu@51.44.0.177:~/howners/

      - name: Déployer les images construites par la CI
        # Le build sur l'instance (2 vCPU / 4 Go) prenait 10-20 min et pouvait
        # la saturer ; désormais : login GHCR (jeton éphémère du run), pull des
        # images :latest / :staging, redémarrage. FRONTEND_TAG=staging cible la
        # variante frontend construite avec le domaine du staging.
        run: |
          ssh ubuntu@51.44.0.177 "echo '${{ secrets.GITHUB_TOKEN }}' | sudo docker login ghcr.io -u '${{ github.actor }}' --password-stdin \
            && cd ~/howners \
            && sudo FRONTEND_TAG=staging docker compose --env-file .env.prod -f docker-compose.prod.yml pull backend frontend \
            && sudo FRONTEND_TAG=staging docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --remove-orphans \
            && sudo docker image prune -f \
            && df -h / | tail -1"

      - name: Vérifier la santé
        # Spring Boot + Liquibase mettent 1 à 2 min à redémarrer après un rebuild :
        # on interroge l'API jusqu'à 5 min avant de déclarer le déploiement en échec.
        run: |
          for i in $(seq 1 30); do
            if curl -sf --max-time 10 https://api.staging.howners-app.com/actuator/health | grep -q '"status":"UP"'; then
              echo "API UP après $((i*10))s"
              curl -sf -o /dev/null --max-time 15 https://staging.howners-app.com
              exit 0
            fi
            sleep 10
          done
          echo "L'API n'est pas revenue UP en 5 minutes" >&2
          exit 1
